name: Deploy Console to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck && yarn lint && yarn test --run
      - run: yarn build
      # E2E disabled
      - if: false
        run: yarn playwright install --with-deps chromium firefox webkit
      - if: false
        run: yarn e2e
      - name: Build for Pages
        run: yarn build && node scripts/preparePages.mjs
        env:
          CONSOLE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/' }}
      - name: Add custom domain when configured
        if: vars.PAGES_CUSTOM_DOMAIN != ''
        env:
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: printf '%s\n' "$PAGES_CUSTOM_DOMAIN" > build/client/CNAME
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
