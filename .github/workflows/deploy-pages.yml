name: Deploy Console to GitHub Pages

on:
  push:
    branches: [main, codex/poc]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck && yarn lint && yarn test --run
      - run: yarn build
      - run: yarn playwright install --with-deps chromium firefox webkit
      - run: yarn e2e
      - name: Build for Pages
        run: yarn build && node scripts/preparePages.mjs
        env:
          CONSOLE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/console-app/' }}
      - name: Add custom domain when configured
        if: vars.PAGES_CUSTOM_DOMAIN != ''
        env:
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: printf '%s\n' "$PAGES_CUSTOM_DOMAIN" > build/client/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
