name: Deploy Console to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Typecheck, lint and test
        run: yarn typecheck && yarn lint && yarn test --run
      - name: Build
        run: yarn build
      # E2E disabled
      - name: Install Playwright browsers
        if: false
        run: yarn playwright install --with-deps chromium firefox webkit
      - name: Run end-to-end tests
        if: false
        run: yarn e2e
      - name: Build for Pages
        run: yarn build && node scripts/preparePages.mjs
        env:
          CONSOLE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/' }}
      - name: Add custom domain when configured
        if: vars.PAGES_CUSTOM_DOMAIN != ''
        env:
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: printf '%s\n' "$PAGES_CUSTOM_DOMAIN" > build/client/CNAME
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
